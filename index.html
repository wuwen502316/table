<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>增强自定义N*M表格管理器</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei",sans-serif;
        }
        body{
            padding:30px;
            background-color: #f4f7fa;
        }
        .header{
            margin-bottom:24px;
            display:flex;
            gap:12px;
            align-items:center;
            flex-wrap: wrap;
        }
        button{
            padding:8px 16px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:15px;
        }
        .btn-add{
            background:#2563eb;
            color:#fff;
        }
        .btn-fill{
            background:#0ea5e9;
            color:#fff;
        }
        .table-wrap{
            background:#fff;
            padding:20px;
            border-radius:10px;
            box-shadow:0 2px 8px #00000015;
            margin-bottom:20px;
        }
        .table-top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:12px;
            margin-bottom:12px;
            flex-wrap: wrap;
        }
        .table-title{    max-width: 15vw;
            font-size:18px;
            font-weight:bold;
            padding:4px 8px;
            border-radius:4px;
            min-width:120px;overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }
        .table-title:hover{
            background:#efefef;
        }
        .btn-del{
            background:#dc2626;
            color:white;
        }
        table{    text-align: center; 
            border-collapse: collapse;
            width:100%;
        }
        td{    display: inline-block;
            border:1px solid #ccc;
            width:80px;
            height:50px;
            padding:0px;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;    text-align: center;    line-height: 50px;
        }
        td:hover{
            background:#f8f8f8;
        }
        td input{
            width:100%;
            height:100%;
            border:none;
            outline:none;
            padding:4px;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="btn-add" id="addTableBtn">新建表格(支持n*m / n m)</button>
        <span>双击单元格原地编辑；填充支持[val]*3重复语法</span>
    </div>
    <div id="container"><div class="table-wrap" data-index="0"><div class="table-top"><div class="table-title">title</div><button class="btn-fill">批量填充表格</button><button class="btn-del">删除表格</button></div><table><tr><td>2</td><td>2</td></tr><tr><td>是</td><td>是</td></tr></table></div><div class="table-wrap" data-index="1"><div class="table-top"><div class="table-title">title</div><button class="btn-fill">批量填充表格</button><button class="btn-del">删除表格</button></div><table><tr><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td></tr></table></div></div>
 <script>
        const STORAGE_KEY = "customTableList";
        let tableList = [];

        function loadStorage(){
            const data = localStorage.getItem(STORAGE_KEY);
            if(data) tableList = JSON.parse(data);
        }

        function saveStorage(){
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tableList));
        }

        function createEmptyData(n, m){
            let arr = [];
            for(let i = 0; i < n; i++){
                let row = [];
                for(let j = 0; j < m; j++) row.push("");
                arr.push(row);
            }
            return arr;
        }

        /**
         * 展开重复标记
         * 支持 [12]*N 数字模式、["字符串"]*N文本模式，N必须为数字
         */
        function expandRepeatTokens(tokens, isSpaceMode){
            let res = [];
            // 正则匹配 [内容]*次数
            const reg = /^\[(.*)\]\*(\d+)$/;
            for(let str of tokens){
                const match = str.match(reg);
                if(match){
                    let inner = match[1];
                    let repeatNum = Number(match[2]);
                    if(isNaN(repeatNum) || repeatNum <= 0){
                        alert(`重复次数「${match[2]}」必须是大于0的数字`);
                        return null;
                    }
                    // 判断是否带双引号包裹字符串
                    if(/^".*"$/.test(inner)){
                        inner = inner.slice(1,-1);
                    }else{
                        // 不带引号则内部必须为纯数字
                        if(!/^\d+$/.test(inner)){
                            alert(`不带引号的重复项 [${inner}]*${repeatNum}，括号内只允许纯数字；文本请使用 ["内容"]*N`);
                            return null;
                        }
                    }
                    for(let i = 0;i < repeatNum;i++){
                        res.push(inner);
                    }
                }else{
                    //普通元素
                    if(isSpaceMode){
                        if(!/^\d+$/.test(str)){
                            alert("空格分隔模式普通单元格只能填写纯数字；文本请改用反斜杠 \\ 分隔");
                            return null;
                        }
                    }
                    res.push(str);
                }
            }
            return res;
        }

        function parseFillData(inputStr, total){
            let list;
            let isSpaceMode = !inputStr.includes("\\");
            if(inputStr.includes("\\")){
                list = inputStr.split("\\").map(item=>item.trim()).filter(s=>s);
            }else{
                list = inputStr.trim().split(/\s+/).filter(s=>s);
            }
            list = expandRepeatTokens(list,isSpaceMode);
            if(list === null) return null;
            return list;
        }

        function renderAll(){
            const box = document.getElementById("container");
            box.innerHTML = "";

            tableList.forEach((tableItem, index)=>{
                const wrap = document.createElement("div");
                wrap.className = "table-wrap";
                wrap.dataset.index = index;
                const cellCount = tableItem.rows * tableItem.cols;

                const topBar = document.createElement("div");
                topBar.className = "table-top";

                const titleDom = document.createElement("div");
                titleDom.className = "table-title";
                titleDom.innerText = tableItem.title;
                titleDom.ondblclick = function(){
                    const newName = prompt("修改表格标题", tableItem.title);
                    if(newName !== null){
                        tableItem.title = newName;
                        saveStorage();
                        renderAll();
                    }
                }

                const fillBtn = document.createElement("button");
                fillBtn.className = "btn-fill";
                fillBtn.innerText = "批量填充表格";
                fillBtn.onclick = function(){
                    const inputText = prompt(`格式示例 [23]*3 或者 ["我的娃"]*5，共需${cellCount}个单元格`, "");
                    if(inputText===null || inputText.trim()==="") return;
                    let res = parseFillData(inputText,cellCount);
                    if(!res) return;

                    if(res.length > cellCount){
                        alert(`展开后一共有${res.length}条数据，大于格子总数${cellCount}；超出内容已经设置为本表格标题`);
                        tableItem.title = res.slice(cellCount).join(" ");
                        res = res.slice(0,cellCount);
                    }else if(res.length < cellCount){
                        const last = res[res.length - 1];
                        while(res.length < cellCount){
                            res.push(last);
                        }
                    }
                    let ptr = 0;
                    for(let i=0;i<tableItem.rows;i++){
                        for(let j=0;j<tableItem.cols;j++){
                            tableItem.data[i][j] = res[ptr++];
                        }
                    }
                    saveStorage();
                    renderAll();
                }

                const delBtn = document.createElement("button");
                delBtn.className = "btn-del";
                delBtn.innerText = "删除表格";
                delBtn.onclick = function(){
                    if(confirm("确定要删除该表格吗？删除之后数据不可恢复！")){
                        tableList.splice(index,1);
                        saveStorage();
                        renderAll();
                    }
                }

                topBar.appendChild(titleDom);
                topBar.appendChild(fillBtn);
                topBar.appendChild(delBtn);
                wrap.appendChild(topBar);

                const t = document.createElement("table");
                for(let i = 0; i < tableItem.rows; i++){
                    const tr = document.createElement("tr");
                    for(let j = 0; j < tableItem.cols; j++){
                        const td = document.createElement("td");
                        td.innerText = tableItem.data[i][j];
                        td.ondblclick = function(){
                            const oldVal = tableItem.data[i][j];
                            td.innerHTML = "";
                            const input = document.createElement("input");
                            input.value = oldVal;
                            td.appendChild(input);
                            input.focus();

                            const finishEdit = ()=>{
                                tableItem.data[i][j] = input.value;
                                saveStorage();
                                td.innerText = tableItem.data[i][j];
                            };
                            input.addEventListener("blur",finishEdit);
                            input.addEventListener("keydown",(e)=>{
                                if(e.key === "Enter") finishEdit();
                            })
                        }
                        tr.appendChild(td);
                    }
                    t.appendChild(tr);
                }
                wrap.appendChild(t);
                box.appendChild(wrap);
            })
        }

        document.getElementById("addTableBtn").onclick = function(){
            let inputStr = prompt("请输入行列，格式支持：n*m 或者 n m");
            if(!inputStr) return;
            let parts;
            if(inputStr.includes("*")){
                parts = inputStr.trim().split("*");
            }else{
                parts = inputStr.trim().split(/\s+/).filter(s=>s);
            }
            if(parts.length!==2){
                alert("输入格式错误！示例：n*m  /  n m");
                return;
            }
            let n = Number(parts[0]);
            let m = Number(parts[1]);
            if(isNaN(n) || isNaN(m) || n<=0 || m<=0 || n>20 || m>100){
                alert("行列数值必须大于0、n和m最大不能分别不能超过20，100");
                return;
            }

            const newTable = {
                title:"title",
                rows:n,
                cols:m,
                data: createEmptyData(n,m)
            }
            tableList.push(newTable);
            saveStorage();
            renderAll();
        }

        loadStorage();
        renderAll();
         let triggerLock = false;

        document.addEventListener('keydown', (e) => {
            if(e.altKey && e.key.toLowerCase() === 'c' && !triggerLock){
                e.preventDefault();
                triggerLock = true;
                localStorage.customTableList = "";
                location.reload()
                }
            })

            document.addEventListener('keyup', (e)=>{
            // 松开按键解锁
            if(e.key.toLowerCase() === 'c'){
                triggerLock = false;
            }
        })
    </script>

</body></html>
